version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: existence-postgres
    restart: always
    environment:
      POSTGRES_DB: existence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d existence"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: existence-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: Existence
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/existence
      JWT_SECRET_KEY: existence-production-jwt-security-key-32chars-min
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PIN_MAX_FAILED_ATTEMPTS: 5
      PIN_LOCKOUT_MINUTES: 15
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: existence-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
