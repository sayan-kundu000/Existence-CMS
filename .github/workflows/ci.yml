name: Existence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Validation & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Database Migrations (SQLite Testbed)
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Execute Pytest Automated Test Suite
        working-directory: ./backend
        run: |
          pytest tests/ -v

  frontend-ci:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Automated Frontend Tests
        working-directory: ./frontend
        run: |
          npm test

      - name: TypeScript Static Typecheck
        working-directory: ./frontend
        run: |
          npm run typecheck

      - name: Build Production SPA Bundle
        working-directory: ./frontend
        run: |
          npm run build
